<main class="registro-page"><section class="registro-showcase" aria-hidden="true"><a class="brand" routerLink="/tienda">HOME <span>STYLE</span></a><div><p>BIENVENIDO A CASA</p><h2>Diseña un espacio que hable de ti.</h2><span>Regístrate y guarda tus piezas favoritas para volver a ellas cuando quieras.</span></div></section><section class="registro-area"><div class="registro-panel"><div><p class="eyebrow">Crea tu cuenta</p><h1>Únete a HomeStyle</h1><p class="intro">Completa tus datos para empezar a comprar.</p></div><form (ngSubmit)="registrar()" #registroForm="ngForm" class="registro-form"><label>Nombre de usuario<input name="nombre" [(ngModel)]="nombre" autocomplete="username" placeholder="¿Cómo te llamamos?" required /></label><label>Correo electrónico<input type="email" name="email" [(ngModel)]="email" autocomplete="email" placeholder="correo@ejemplo.com" required /></label><label>Teléfono<input type="tel" name="telefono" [(ngModel)]="telefono" autocomplete="tel" placeholder="10 dígitos" required /></label><div class="password-row"><label>Contraseña<span class="password-field"><input [type]="mostrarPassword() ? 'text' : 'password'" name="password" [(ngModel)]="password" autocomplete="new-password" required /><button type="button" class="password-toggle" (click)="mostrarPassword.set(!mostrarPassword())" [attr.aria-label]="mostrarPassword() ? 'Ocultar contraseña' : 'Mostrar contraseña'" [attr.title]="mostrarPassword() ? 'Ocultar contraseña' : 'Mostrar contraseña'"><span aria-hidden="true">&#128065;</span></button></span></label><label>Confirmar contraseña<span class="password-field"><input [type]="mostrarConfirmarPassword() ? 'text' : 'password'" name="confirmarPassword" [(ngModel)]="confirmarPassword" autocomplete="new-password" required /><button type="button" class="password-toggle" (click)="mostrarConfirmarPassword.set(!mostrarConfirmarPassword())" [attr.aria-label]="mostrarConfirmarPassword() ? 'Ocultar confirmación de contraseña' : 'Mostrar confirmación de contraseña'" [attr.title]="mostrarConfirmarPassword() ? 'Ocultar contraseña' : 'Mostrar contraseña'"><span aria-hidden="true">&#128065;</span></button></span></label></div><p *ngIf="error()" class="error">{{ error() }}</p><button type="submit" [disabled]="cargando()">{{ cargando() ? 'Creando cuenta...' : 'Crear mi cuenta' }}</button></form><p class="login-link">¿Ya tienes una cuenta? <a routerLink="/login">Inicia sesión</a></p></div></section></main>
